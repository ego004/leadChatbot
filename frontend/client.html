<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>LeadGenius AI - Client Dashboard</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#0b1220;color:#e6eaf2}
    header{padding:16px 20px;background:#0e1628;border-bottom:1px solid #1f2a44;display:flex;gap:12px;align-items:center}
    header h1{margin:0;font-size:18px}
    main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px}
    section,aside{background:#0e1628;border:1px solid #1f2a44;border-radius:10px}
    .card{padding:14px 14px 10px}
    h2{margin:0 0 8px;font-size:15px}
    input,select,button{background:#0b1220;color:#e6eaf2;border:1px solid #273252;border-radius:8px;padding:8px 10px}
    button{cursor:pointer}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .grid{display:grid;gap:8px}
    .muted{color:#9aa7c7}
    .list{max-height:500px;overflow:auto;border:1px solid #1f2a44;border-radius:8px;padding:6px}
    .item{padding:8px;border-bottom:1px solid #1f2a44;cursor:pointer}
    .item:hover{background:#0b1220}
    pre{white-space:pre-wrap;background:#0b1220;border:1px solid #1f2a44;border-radius:8px;padding:8px}
    .kv{display:grid;grid-template-columns:160px 1fr;gap:6px;align-items:center}
  </style>
</head>
<body>
  <header>
    <h1>Client Dashboard</h1>
    <span style="flex:1"></span>
    <span id="status" class="muted"></span>
  </header>
  <main>
    <aside>
      <div class="card grid" style="gap:10px">
        <h2>Auth</h2>
        <input id="baseUrl" placeholder="Base URL" value="http://localhost:8000"/>
        <input id="clientJwt" placeholder="Paste Client JWT"/>
        <div class="row">
          <button id="saveAuth">Use Token</button>
          <small class="muted">Get JWT from your admin.</small>
        </div>
      </div>
      <div class="card grid" style="gap:10px">
        <h2>Analytics</h2>
        <div class="row">
          <select id="timeframe">
            <option value="today">today</option>
            <option value="week">week</option>
            <option value="month">month</option>
          </select>
          <button id="loadSummary">Load Summary</button>
        </div>
        <div class="row">
          <input id="days" type="number" min="1" max="60" value="7" style="width:90px"/>
          <button id="loadDaily">Load Daily</button>
        </div>
        <pre id="analyticsOut">{}</pre>
      </div>
    </aside>
    <section>
      <div class="card grid" style="gap:10px">
        <h2>Leads</h2>
        <div class="row">
          <button id="refreshLeads">Refresh</button>
        </div>
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap:12px">
          <div>
            <div class="list" id="leadsList"></div>
          </div>
          <div>
            <h2>Lead Details</h2>
            <pre id="leadDetails">{}</pre>
          </div>
        </div>
      </div>
    </section>
  </main>
<script>
const qs = s=>document.querySelector(s);
const state = {
  base: localStorage.getItem('client_base') || 'http://localhost:8000',
  jwt: localStorage.getItem('client_jwt') || ''
};
qs('#baseUrl').value = state.base;
qs('#clientJwt').value = state.jwt;
qs('#status').textContent = state.jwt? 'JWT loaded':'No JWT';
function setBase(v){ state.base=v; localStorage.setItem('client_base', v); }
function setJwt(v){ state.jwt=v; localStorage.setItem('client_jwt', v); qs('#status').textContent = v? 'JWT set':'No JWT'; }
function url(p){ return state.base.replace(/\/$/, '') + p; }
function auth(){ return { 'Authorization': 'Bearer ' + state.jwt }; }

qs('#saveAuth').onclick=()=>{ setBase(qs('#baseUrl').value.trim()); setJwt(qs('#clientJwt').value.trim()); };

qs('#loadSummary').onclick=async ()=>{
  try{
    const tf = qs('#timeframe').value;
    const res = await fetch(url('/api/client/analytics/summary?timeframe='+encodeURIComponent(tf)), {headers: auth()});
    const data = await res.json();
    qs('#analyticsOut').textContent = JSON.stringify(data, null, 2);
  }catch(e){ qs('#analyticsOut').textContent = 'Failed to load summary'; console.error(e); }
};
qs('#loadDaily').onclick=async ()=>{
  try{
    const d = parseInt(qs('#days').value||'7',10);
    const res = await fetch(url('/api/client/analytics/daily?days='+d), {headers: auth()});
    const data = await res.json();
    qs('#analyticsOut').textContent = JSON.stringify(data, null, 2);
  }catch(e){ qs('#analyticsOut').textContent = 'Failed to load daily'; console.error(e); }
};

qs('#refreshLeads').onclick=async ()=>{
  try{
    qs('#leadsList').innerHTML = '<small class="muted">Loading...</small>';
    const res = await fetch(url('/api/client/leads'), {headers: auth()});
    const data = await res.json();
    const leads = data.leads || [];
    qs('#leadsList').innerHTML = '';
    leads.forEach(l=>{
      const div = document.createElement('div');
      div.className = 'item';
      div.textContent = (l.lead_id||'') + ' — ' + (l.email || l.phone_number || '');
      div.onclick = ()=> loadLead(l.lead_id);
      qs('#leadsList').appendChild(div);
    });
  }catch(e){ console.error(e); }
};

async function loadLead(leadId){
  try{
    const res = await fetch(url('/api/client/leads/'+encodeURIComponent(leadId)), {headers: auth()});
    const data = await res.json();
    qs('#leadDetails').textContent = JSON.stringify({
      lead: data.lead,
      chat_history_count: Array.isArray(data.chat_history)? data.chat_history.length : (''+ (data.chat_history||'')).split('\n').filter(Boolean).length,
      email_messages_count: (data.email_messages||[]).length,
    }, null, 2);
  }catch(e){ qs('#leadDetails').textContent = 'Failed to load lead'; console.error(e); }
}
</script>
</body>
</html>
