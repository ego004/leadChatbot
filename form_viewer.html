<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Chatbot API Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .login-section, .contacts-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        
        button:hover {
            background: #5a67d8;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .status {
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-weight: 600;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .contacts-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .contacts-table th,
        .contacts-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .contacts-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        
        .contacts-table tr:hover {
            background: #f5f5f5;
        }
        
        .token-info {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
        }
        
        .api-url {
            background: #fff3cd;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #ffeaa7;
        }
        
        .api-url strong {
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Lead Chatbot API Client</h1>
        
        <div class="api-url">
            <strong>API Base URL:</strong> https://api.orrya.co/api
        </div>
        
        <!-- Login Section -->
        <div class="login-section">
            <h2>🔐 Admin Login</h2>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="admin@example.com" value="">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter password" value="">
            </div>
            <button id="loginBtn" onclick="login()">Login</button>
            <div id="loginStatus"></div>
            <div id="tokenInfo" class="token-info" style="display: none;"></div>
        </div>
        
        <!-- Contacts Section -->
        <div class="contacts-section">
            <h2>📋 Form Contacts</h2>
            <button id="getContactsBtn" onclick="getContacts()" disabled>Get All Contacts</button>
            <div id="contactsStatus"></div>
            <div id="contactsData"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://api.orrya.co/api';
        let accessToken = null;
        
        function showStatus(elementId, message, type = 'loading') {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="status ${type}">${message}</div>`;
        }
        
        function clearStatus(elementId) {
            document.getElementById(elementId).innerHTML = '';
        }
        
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            
            if (!email || !password) {
                showStatus('loginStatus', '❌ Please enter both email and password', 'error');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            showStatus('loginStatus', '🔄 Attempting to log in...', 'loading');
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.access_token) {
                    accessToken = data.access_token;
                    showStatus('loginStatus', '✅ Login successful!', 'success');
                    
                    // Show token info
                    const tokenInfo = document.getElementById('tokenInfo');
                    tokenInfo.style.display = 'block';
                    tokenInfo.innerHTML = `<strong>Access Token:</strong> ${data.access_token.substring(0, 50)}...`;
                    
                    // Enable contacts button
                    document.getElementById('getContactsBtn').disabled = false;
                } else {
                    showStatus('loginStatus', `❌ Login failed: ${data.detail || 'Invalid credentials'}`, 'error');
                }
            } catch (error) {
                showStatus('loginStatus', `❌ Network error: ${error.message}`, 'error');
                console.error('Login error:', error);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        }
        
        async function getContacts() {
            if (!accessToken) {
                showStatus('contactsStatus', '❌ Please login first', 'error');
                return;
            }
            
            const getContactsBtn = document.getElementById('getContactsBtn');
            getContactsBtn.disabled = true;
            getContactsBtn.textContent = 'Loading...';
            showStatus('contactsStatus', '🔄 Fetching contacts...', 'loading');
            
            try {
                const response = await fetch(`${API_BASE}/form/contacts`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showStatus('contactsStatus', `✅ Found ${data.total_count || 0} contacts`, 'success');
                    displayContacts(data.contacts || []);
                } else {
                    showStatus('contactsStatus', `❌ Failed to fetch contacts: ${data.detail || 'Unknown error'}`, 'error');
                    console.error('Response:', data);
                }
            } catch (error) {
                showStatus('contactsStatus', `❌ Network error: ${error.message}`, 'error');
                console.error('Contacts error:', error);
            } finally {
                getContactsBtn.disabled = false;
                getContactsBtn.textContent = 'Get All Contacts';
            }
        }
        
        function displayContacts(contacts) {
            const contactsData = document.getElementById('contactsData');
            
            if (!contacts || contacts.length === 0) {
                contactsData.innerHTML = '<p>No contacts found.</p>';
                return;
            }
            
            let tableHTML = `
                <table class="contacts-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Company</th>
                            <th>Phone</th>
                            <th>Service</th>
                            <th>Message</th>
                            <th>Created At</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            contacts.forEach(contact => {
                tableHTML += `
                    <tr>
                        <td>${contact.id || 'N/A'}</td>
                        <td>${contact.name || 'N/A'}</td>
                        <td>${contact.email || 'N/A'}</td>
                        <td>${contact.company || 'N/A'}</td>
                        <td>${contact.phone || 'N/A'}</td>
                        <td>${contact.service || 'N/A'}</td>
                        <td>${contact.message ? (contact.message.length > 100 ? contact.message.substring(0, 100) + '...' : contact.message) : 'N/A'}</td>
                        <td>${contact.created_at ? new Date(contact.created_at).toLocaleString() : 'N/A'}</td>
                    </tr>
                `;
            });
            
            tableHTML += `
                    </tbody>
                </table>
            `;
            
            contactsData.innerHTML = tableHTML;
        }
        
        // Allow Enter key to submit login
        document.addEventListener('DOMContentLoaded', function() {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            
            function handleEnterKey(event) {
                if (event.key === 'Enter') {
                    login();
                }
            }
            
            emailInput.addEventListener('keypress', handleEnterKey);
            passwordInput.addEventListener('keypress', handleEnterKey);
        });
    </script>
</body>
</html>
